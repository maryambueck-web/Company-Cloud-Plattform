name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check decks
        run: npm run check

      - name: Build HTML presentations
        run: npm run build:web

      - name: Upload HTML presentations
        uses: actions/upload-artifact@v4
        with:
          name: html-presentations
          path: dist/
          if-no-files-found: error